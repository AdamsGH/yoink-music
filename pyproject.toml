[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoink-music"
version = "0.1.1"
description = "Music link aggregator plugin for yoink-bot (Odesli/song.link)"
requires-python = ">=3.11"
dependencies = [
    "yoink-core",
    "httpx[socks]>=0.27",
    "curl-cffi>=0.7",
    "python-telegram-bot>=22.8",
    "ytmusicapi>=1.7",
    "yandex-music>=2.0",
    "aiohttp",
    "transliterate>=1.10",
]

[project.entry-points."yoink.plugins"]
music = "yoink_music.plugin:MusicPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/yoink_music"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
# Plugins live in a monorepo: the real interpreter + deps are at the repo root,
# and cross-plugin/core imports resolve via explicit search paths.
python-interpreter-path = "../../.venv/bin/python"
search-path = [
    "src",
    "../../src",
    "../yoink-insight/src",
    "../yoink-dl/src",
    "../yoink-stats/src",
]
# Optional third-party deps that the bot imports lazily under try/except
# ImportError. They are not in the core monorepo .venv, only in the
# yoink-music wheel that runs inside the docker image.
ignore-missing-imports = [
    "yandex_music",
    "ytmusicapi",
    "curl_cffi",
    "curl_cffi.requests",
    "yt_dlp",
    "transliterate",
    "pytest",
    "pytest_asyncio",
]
